<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6F4518">
  <title>음표 피자 &amp; 쉼표 파이 — 리듬 요리사</title>
  <link rel="stylesheet" href="rulebook.css">
  <!-- ===== BLOCK: STYLE ===== -->
  <style>
    :root {
      --cream: #FFF8E7;
      --cream-deep: #F3E9D2;
      --brown: #6F4518;
      --brown-soft: #9B6C40;
      --red: #E94F37;
      --red-dark: #C83C2B;
      --yellow: #F6BD60;
      --purple: #5F6CAF;
      --green: #6A994E;
      --ink: #38230F;
      --white: #FFFFFF;
      --shadow: 0 6px 14px rgba(111, 69, 24, .16);
      --dur-tap: 80ms;
      --dur-pop: 150ms;
      --dur-ui: 250ms;
      --dur-screen: 300ms;
      --dur-scene: 400ms;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
      --ease-bounce: cubic-bezier(.34, 1.56, .64, 1);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0;
      overflow: hidden;
      background: var(--cream-deep);
      color: var(--brown);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }
    button:focus-visible { outline: 4px solid rgba(95,108,175,.48); outline-offset: 3px; }
    #app-root { position: fixed; inset: 0; overflow: hidden; background: var(--cream-deep); }
    #scale-wrap {
      position: absolute; left: 50%; top: 50%;
      width: 390px; height: 844px; overflow: hidden;
      transform-origin: center center;
      background: var(--cream);
      box-shadow: 0 20px 50px rgba(111,69,24,.22);
      isolation: isolate;
    }
    #scale-wrap::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
      opacity: .28;
      background-image: radial-gradient(circle at 12px 12px, rgba(111,69,24,.16) 1px, transparent 1.5px), linear-gradient(135deg, rgba(246,189,96,.12), transparent 55%);
      background-size: 24px 24px, 100% 100%;
    }
    .screen { position: absolute; inset: 0; display: none; overflow: hidden; animation: screenIn var(--dur-screen) var(--ease-out) both; }
    .screen.active { display: block; }
    .screen-pad { padding: 18px 18px 20px; }
    .eyebrow { font-size: 12px; letter-spacing: .08em; font-weight: 800; color: var(--brown-soft); }
    .screen-title { margin: 0; font-size: 24px; line-height: 1.1; color: var(--brown); }
    .muted { color: rgba(111,69,24,.68); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; padding: 0 18px; border-radius: 18px; font-weight: 900;
      box-shadow: 0 5px 0 rgba(111,69,24,.18), var(--shadow);
      transition: transform var(--dur-tap) ease, filter var(--dur-tap) ease, box-shadow var(--dur-tap) ease;
      touch-action: manipulation;
    }
    .btn:active, .btn.pressed { transform: scale(.96); filter: brightness(.94); box-shadow: 0 2px 0 rgba(111,69,24,.18); }
    .btn:disabled, .btn.disabled { filter: grayscale(.7); opacity: .5; box-shadow: none; cursor: default; }
    .btn-red { background: var(--red); color: var(--white); }
    .btn-yellow { background: var(--yellow); color: var(--brown); }
    .btn-green { background: var(--green); color: var(--white); }
    .btn-purple { background: var(--purple); color: var(--white); }
    .btn-cream { background: var(--cream); color: var(--brown); border: 2px solid rgba(111,69,24,.45); box-shadow: 0 4px 0 rgba(111,69,24,.12); }
    .icon { display: inline-grid; place-items: center; width: 24px; height: 24px; font-size: 22px; line-height: 1; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .back-btn { width: 48px; height: 48px; border-radius: 16px; background: rgba(255,255,255,.7); font-size: 28px; font-weight: 900; box-shadow: 0 3px 0 rgba(111,69,24,.12); }
    .coin-badge { display: inline-flex; align-items: center; gap: 6px; min-width: 84px; height: 38px; justify-content: center; border-radius: 20px; background: rgba(246,189,96,.46); font-weight: 900; color: var(--brown); }
    .coin-badge .coin { color: #D89614; text-shadow: 0 1px 0 #fff0b8; }
    .toast { position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 20px); min-width: 230px; max-width: 350px; padding: 12px 18px; border-radius: 18px; background: var(--brown); color: #fff; text-align: center; font-weight: 800; opacity: 0; pointer-events: none; z-index: 70; transition: opacity 180ms ease, transform 180ms ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .screen-ornament { position: absolute; pointer-events: none; opacity: .24; }

    /* splash / main */
    .splash-screen { display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 42%, #fffdf5 0 20%, var(--cream) 62%); }
    .splash-center { margin-top: -48px; animation: logoIn 600ms var(--ease-out) both; }
    .logo-mark { position: relative; width: 180px; height: 180px; margin: 0 auto 20px; border-radius: 50%; border: 10px solid var(--brown); overflow: hidden; background: conic-gradient(var(--red) 0 50%, var(--purple) 50% 100%); box-shadow: 0 12px 0 rgba(111,69,24,.16), 0 16px 26px rgba(111,69,24,.18); }
    .logo-mark::before, .logo-mark::after { content: ""; position: absolute; inset: 30px; border-radius: 50%; border: 7px dashed rgba(255,255,255,.7); }
    .logo-mark::after { inset: 64px; background: var(--yellow); border: 0; box-shadow: 0 0 0 5px rgba(255,248,231,.8); }
    .splash-title { margin: 0; font-size: 28px; line-height: 1.15; color: var(--brown); }
    .splash-sub { margin: 8px 0 0; font-size: 17px; font-weight: 800; color: var(--purple); }
    .start-hint { position: absolute; left: 0; right: 0; bottom: 58px; font-size: 17px; font-weight: 900; animation: blink 1.3s ease-in-out infinite; }
    .main-screen { background: linear-gradient(180deg, #FFF8E7 0%, #FFF3D6 70%, #F6BD60 100%); }
    .main-header { height: 245px; text-align: center; padding-top: 26px; position: relative; }
    .main-header .logo-mini { width: 112px; height: 112px; margin: 0 auto 12px; border: 7px solid var(--brown); border-radius: 50%; background: conic-gradient(var(--red) 0 50%, var(--purple) 50%); position: relative; box-shadow: 0 8px 0 rgba(111,69,24,.14); }
    .main-header .logo-mini::after { content: "✦"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 36px; color: #fff4c9; }
    .main-header h1 { margin: 0; font-size: 28px; line-height: 1.05; }
    .main-header p { margin: 8px 0 0; font-weight: 800; color: var(--purple); }
    .steam { position: absolute; top: 12px; left: 95px; font-size: 30px; opacity: .35; animation: steam 2.5s ease-in-out infinite; }
    .steam.s2 { left: 270px; top: 25px; animation-delay: .7s; }
    .main-buttons { display: flex; flex-direction: column; gap: 14px; align-items: center; padding-top: 10px; }
    .main-buttons .btn { width: 300px; }
    .main-buttons .primary { height: 72px; font-size: 23px; border-radius: 22px; }
    .main-buttons .secondary { height: 56px; font-size: 18px; }
    .main-footer { position: absolute; inset: auto 0 0; height: 185px; padding: 16px 18px 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .walk-belt { width: 100%; height: 65px; display: flex; align-items: end; justify-content: space-around; border-bottom: 4px solid rgba(111,69,24,.28); font-size: 42px; }
    .walk-belt span { animation: walk 1.2s ease-in-out infinite; }
    .walk-belt span:nth-child(2){animation-delay:.12s}.walk-belt span:nth-child(3){animation-delay:.24s}.walk-belt span:nth-child(4){animation-delay:.36s}.walk-belt span:nth-child(5){animation-delay:.48s}
    .version { font-size: 12px; color: rgba(111,69,24,.62); }

    /* mode / stage */
    .mode-screen, .stage-screen, .codex-screen { background: linear-gradient(180deg, var(--cream) 0%, #F8EACD 100%); }
    .mode-header, .stage-header, .codex-header { height: 80px; display: grid; grid-template-columns: 56px 1fr 92px; align-items: center; padding: 14px 12px 10px; }
    .mode-header h2, .stage-header h2, .codex-header h2 { margin: 0; text-align: center; font-size: 22px; }
    .mode-cards { display: flex; flex-direction: column; gap: 18px; padding: 10px 20px; }
    .mode-card { position: relative; min-height: 190px; padding: 20px 18px; display: grid; grid-template-columns: 116px 1fr; align-items: center; gap: 12px; border-radius: 26px; text-align: left; overflow: hidden; box-shadow: var(--shadow); border: 3px solid rgba(111,69,24,.1); transition: transform 150ms var(--ease-bounce), filter 150ms ease; }
    .mode-card:active { transform: scale(.97); }
    .mode-card.pizza { background: linear-gradient(135deg, #FCE1D9, #FFF2DA); }
    .mode-card.pie { background: linear-gradient(135deg, #E8E9F8, #F6EBD1); }
    .mode-card.mix { background: linear-gradient(135deg, #FCE1D9 0 50%, #E8E9F8 50%); }
    .mode-card.locked { filter: grayscale(.8); opacity: .64; }
    .mode-art { width: 112px; height: 112px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.54); }
    .mode-art svg { width: 100px; height: 100px; }
    .mode-card h3 { margin: 0 0 8px; font-size: 21px; }
    .mode-card p { margin: 0 0 10px; font-size: 14px; line-height: 1.35; font-weight: 700; color: rgba(56,35,15,.76); }
    .progress-line { font-size: 13px; font-weight: 900; }
    .lock-copy { margin-top: 8px; color: var(--red-dark); font-size: 12px; font-weight: 900; }
    .stage-screen { overflow: hidden; }
    .stage-header { padding-right: 12px; }
    .stage-header .stage-heading { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 900; }
    .stage-map { position: absolute; inset: 84px 0 88px; }
    .map-path { position: absolute; inset: 18px 45px; width: 300px; height: 620px; pointer-events: none; opacity: .6; }
    .stage-node { position: absolute; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 23px; font-weight: 1000; box-shadow: 0 5px 0 rgba(111,69,24,.18); transition: transform 120ms var(--ease-bounce); }
    .stage-node:active { transform: scale(.92); }
    .stage-node.available { background: var(--yellow); color: var(--brown); animation: nodePulse 1.5s ease-in-out infinite; }
    .stage-node.clear { background: var(--green); color: #fff; }
    .stage-node.locked { background: #D8D5CE; color: #8D877B; filter: grayscale(.7); }
    .stage-node .stars { position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); white-space: nowrap; color: var(--yellow); font-size: 14px; text-shadow: 0 1px 0 var(--brown); }
    .rush-bar { position: absolute; inset: auto 20px 16px; height: 58px; }
    .rush-bar .btn { width: 100%; height: 58px; }

    /* kitchen */
    .kitchen-screen { background: var(--cream); }
    .kitchen-hud { position: absolute; inset: 0 0 auto; height: 58px; padding: 5px 8px; display: grid; grid-template-columns: 52px 1fr 76px; align-items: center; background: rgba(111,69,24,.1); border-bottom: 2px solid rgba(111,69,24,.12); z-index: 2; }
    .icon-btn { width: 48px; height: 48px; border-radius: 15px; background: rgba(255,255,255,.7); font-weight: 1000; font-size: 22px; box-shadow: 0 3px 0 rgba(111,69,24,.13); }
    .hud-center { text-align: center; font-size: 13px; font-weight: 900; line-height: 1.1; }
    .hud-center strong { display: block; font-size: 19px; margin-top: 2px; }
    .hud-coin { justify-self: end; min-width: 70px; font-size: 14px; }
    .customer-ticket { position: absolute; inset: 58px 0 auto; height: 142px; display: grid; grid-template-columns: 112px 1fr; gap: 8px; padding: 9px 12px; }
    .customer-box { display: flex; align-items: center; justify-content: center; position: relative; }
    .customer-box svg { width: 104px; height: 128px; animation: idleBob 2s ease-in-out infinite; }
    .customer-name { position: absolute; bottom: 3px; left: 8px; padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,.7); font-size: 11px; font-weight: 900; }
    .ticket { position: relative; height: 128px; padding: 12px 13px 10px; border-radius: 14px; background: #fff; box-shadow: 0 4px 8px rgba(111,69,24,.15); overflow: hidden; }
    .ticket::before { content: ""; position: absolute; inset: 0 0 auto; height: 7px; background: repeating-linear-gradient(135deg, var(--yellow) 0 7px, transparent 7px 14px); opacity: .9; }
    .ticket-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; }
    .ticket-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; font-weight: 1000; }
    .ticket-items { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 5px; min-height: 34px; }
    .item-chip { display: inline-flex; align-items: center; gap: 3px; min-height: 27px; padding: 2px 6px; border-radius: 9px; font-size: 11px; font-weight: 900; }
    .item-chip.note { background: rgba(233,79,55,.15); color: var(--red-dark); }
    .item-chip.rest { background: rgba(95,108,175,.15); color: var(--purple); }
    .item-chip svg { width: 22px; height: 22px; }
    .ticket-time { display: grid; grid-template-columns: 1fr 34px; gap: 5px; align-items: center; margin-top: 6px; }
    .time-track { height: 10px; overflow: hidden; border-radius: 8px; background: #EDE2C6; }
    .time-fill { height: 100%; width: 100%; border-radius: inherit; background: var(--green); transform-origin: left center; transition: width 100ms linear, background 150ms ease; }
    .time-fill.warn { background: var(--red); }
    .time-number { font-size: 12px; text-align: right; font-weight: 900; }
    .ticket.is-memory { opacity: .15; filter: blur(3px); }
    .memory-note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--brown); font-weight: 1000; font-size: 18px; pointer-events: none; }
    .ticket.is-memory + .memory-note { display: grid; }
    .kitchen-worktop { position: absolute; inset: 200px 0 288px; border-top: 3px solid rgba(111,69,24,.13); border-bottom: 3px solid rgba(111,69,24,.13); background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(246,189,96,.12)); }
    .plate-area { position: absolute; inset: 200px 0 288px; touch-action: none; }
    .plate-stack { position: absolute; left: 7px; top: 22px; width: 56px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .stack-mini { width: 48px; height: 48px; border-radius: 50%; background: #F7D99B; border: 4px solid var(--brown); display: grid; place-items: center; overflow: hidden; box-shadow: 0 2px 0 rgba(111,69,24,.16); }
    .stack-mini svg { width: 42px; height: 42px; }
    .plate-badge { position: absolute; top: 14px; left: 67px; padding: 5px 10px; border-radius: 14px; background: rgba(255,255,255,.78); font-size: 12px; font-weight: 900; z-index: 1; }
    .active-plate { position: absolute; left: 27px; top: 40px; width: 280px; height: 280px; border-radius: 50%; transition: transform 120ms ease; }
    .active-plate.shake { animation: shake 300ms ease both; }
    .plate-svg { width: 280px; height: 280px; display: block; filter: drop-shadow(0 9px 0 rgba(111,69,24,.15)); overflow: visible; }
    .drop-ring { position: absolute; left: 27px; top: 40px; width: 280px; height: 280px; border: 4px dashed rgba(106,153,78,.38); border-radius: 50%; opacity: 0; transform: scale(.98); transition: opacity 120ms ease, border-color 120ms ease, transform 120ms ease; pointer-events: none; }
    .drop-ring.show { opacity: 1; }
    .drop-ring.valid { border-style: solid; border-color: var(--green); transform: scale(1.04); box-shadow: 0 0 0 8px rgba(106,153,78,.12); }
    .gauge { position: absolute; right: 12px; top: 42px; width: 42px; height: 244px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .gauge-cells { width: 30px; height: 196px; display: flex; flex-direction: column-reverse; gap: 3px; }
    .gauge-cell { position: relative; flex: 1; border-radius: 6px; background: rgba(111,69,24,.12); border: 2px solid rgba(111,69,24,.25); overflow: hidden; }
    .gauge-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 3px; background: var(--red); transition: height 180ms ease-out; }
    .gauge-label { font-size: 12px; font-weight: 1000; white-space: nowrap; }
    .gauge-tick { position: absolute; top: 203px; right: 3px; width: 62px; text-align: center; font-size: 13px; font-weight: 1000; }
    .serve-hint { position: absolute; left: 84px; bottom: 17px; font-size: 13px; font-weight: 900; color: var(--green); animation: fadeUp 250ms var(--ease-out) both; }
    .tray { position: absolute; inset: 556px 0 88px; padding: 12px 10px 0; background: linear-gradient(180deg, rgba(111,69,24,.18), rgba(111,69,24,.1)); border-top: 4px solid rgba(111,69,24,.25); touch-action: pan-x; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .tray::-webkit-scrollbar { display:none; }
    .tray-inner { min-width: 100%; height: 174px; display: flex; align-items: start; justify-content: center; gap: 7px; }
    .piece-btn { flex: 0 0 112px; height: 166px; padding: 7px 5px 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; border-radius: 17px; background: rgba(255,255,255,.78); border: 2px solid rgba(111,69,24,.12); box-shadow: 0 4px 0 rgba(111,69,24,.12); touch-action: none; transition: opacity 120ms ease, transform 120ms var(--ease-bounce), box-shadow 120ms ease; }
    .piece-btn:active, .piece-btn.dragging { transform: scale(1.08) translateY(-4px); box-shadow: 0 9px 12px rgba(111,69,24,.25); }
    .piece-btn.hinting { animation: hintGlow 600ms ease-in-out 5; border-color: var(--green); }
    .piece-art { position: relative; width: 96px; height: 103px; display: grid; place-items: center; }
    .piece-art > svg { width: 96px; height: 96px; }
    .piece-art .glyph-overlay { position: absolute; inset: 0; display: grid; place-items: center; }
    .piece-label { width: 100%; text-align: center; font-size: 13px; line-height: 1.2; font-weight: 1000; color: var(--brown); }
    .piece-sub { display: block; margin-top: 2px; font-size: 11px; color: var(--brown-soft); }
    .action-bar { position: absolute; inset: auto 0 0; height: 88px; padding: 12px 12px 12px; display: grid; grid-template-columns: 120px 48px 1fr; align-items: center; gap: 10px; background: var(--cream); border-top: 3px solid rgba(111,69,24,.15); z-index: 3; }
    .action-bar .btn { min-height: 56px; border-radius: 17px; padding: 0 10px; }
    .undo-btn { font-size: 16px; }
    .hint-btn { width: 48px; height: 48px; padding: 0; font-size: 24px; }
    .serve-btn { height: 64px; font-size: 21px; }
    .serve-btn.ready { animation: servePulse 800ms ease-in-out infinite; }
    .lefty .action-bar { direction: rtl; }
    .lefty .action-bar > * { direction: ltr; }

    /* result */
    .result-screen { background: radial-gradient(circle at 50% 22%, #FFFDF5, #F8EACD 70%); text-align: center; padding: 28px 20px; }
    .result-banner { font-size: 27px; font-weight: 1000; }
    .result-banner.fail { color: var(--red); }
    .rush-result .result-banner { color: var(--purple); }
    .rush-result .result-banner.fail { color: var(--red); }
    .rush-score-hero { display: flex; align-items: baseline; justify-content: center; gap: 7px; margin: 22px 0 8px; color: var(--brown); }
    .rush-score-hero strong { font-size: 64px; line-height: 1; color: var(--red); text-shadow: 0 4px 0 rgba(111,69,24,.12); }
    .rush-score-hero span { font-size: 20px; font-weight: 1000; }
    .rush-caption { margin: 0 auto 18px; font-weight: 900; color: rgba(56,35,15,.72); }
    .rush-best { margin-top: 14px; padding-top: 12px; border-top: 2px dashed rgba(111,69,24,.16); font-size: 13px; font-weight: 900; }
    .stars-row { min-height: 96px; display: flex; justify-content: center; align-items: center; gap: 10px; margin: 16px 0 3px; }
    .result-star { font-size: 70px; color: #D6C7A2; filter: grayscale(.5); transform: scale(0); animation: starPop 400ms var(--ease-bounce) forwards; text-shadow: 0 5px 0 rgba(111,69,24,.15); }
    .result-star.earned { color: var(--yellow); filter: none; }
    .star-caption { margin: 0 auto 16px; max-width: 330px; font-size: 13px; font-weight: 800; color: var(--brown-soft); }
    .score-card { width: 340px; margin: 0 auto 22px; padding: 18px 18px 16px; border-radius: 24px; background: rgba(255,255,255,.76); box-shadow: var(--shadow); text-align: left; }
    .score-card h3 { margin: 0 0 12px; text-align: center; font-size: 20px; }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .score-cell { padding: 9px 10px; border-radius: 14px; background: rgba(246,189,96,.18); }
    .score-cell small { display:block; font-size: 11px; color: var(--brown-soft); }
    .score-cell strong { display:block; margin-top: 2px; font-size: 18px; }
    .learned-strip { min-height: 40px; display: flex; justify-content: center; gap: 5px; margin-top: 12px; }
    .learned-strip button { width: 42px; height: 42px; padding: 0; border-radius: 12px; background: #fff; box-shadow: 0 2px 0 rgba(111,69,24,.12); }
    .learned-strip svg { width: 38px; height: 38px; }
    .result-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .result-actions .btn { width: 300px; height: 58px; }

    /* codex */
    .codex-screen { overflow-y: auto; }
    .codex-tabs { display: flex; justify-content: center; gap: 8px; }
    .codex-tab { width: 92px; height: 40px; border-radius: 14px; background: rgba(255,255,255,.65); font-size: 14px; font-weight: 900; }
    .codex-tab.active.note { background: var(--red); color:#fff; }.codex-tab.active.rest { background: var(--purple); color:#fff; }
    .codex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 12px 30px; }
    .codex-card { min-height: 205px; padding: 10px 8px 12px; border-radius: 20px; background: rgba(255,255,255,.82); box-shadow: 0 4px 10px rgba(111,69,24,.12); text-align: center; }
    .codex-card.locked { background: rgba(216,213,206,.7); filter: grayscale(1); }
    .codex-art { display: flex; justify-content: center; align-items:center; gap: 5px; height: 104px; }

  function sliceSvg(noteId,a0=0,a1=360,size=100,withMark=true){

  // [S4] STATE — localStorage 저장·복원과 화면 상태
  function loadSave(){ const base=DEFAULT_SAVE(); try{ const raw=localStorage.getItem('npizza.save.v1'); if(!raw) return base; const parsed=JSON.parse(raw); if(parsed.schemaVersion!==1) return base; return mergeSave(base,parsed); }catch(e){ showToast('저장 기록을 읽지 못해 새로 시작해요'); return base; } }
  function mergeSave(base,src){ const out=JSON.parse(JSON.stringify(base)); const merge=(a,b)=>{Object.keys(b||{}).forEach(k=>{if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=a[k]||{};merge(a[k],b[k]);}else if(b[k]!==undefined)a[k]=b[k];});return a;}; return merge(out,src); }
  function saveNow(){ Game.save.lastPlayedAt=new Date().toISOString(); Game.save.coins=Math.max(0,Math.min(REWARD_CONFIG.coins.cap,Math.floor(Game.save.coins))); try{localStorage.setItem('npizza.save.v1',JSON.stringify(Game.save));}catch(e){} }
  function currentMode(){ return Game.state.mode||'pizza'; }
  function stageConfig(mode=Game.state.mode,stage=Game.state.stage){ return STAGES.find(s=>s.mode===mode&&s.stage===Number(stage)); }
  function isModeUnlocked(mode){ if(mode==='pizza')return true; if(mode==='pie')return (Game.save.progress.pizza.stars[2]||0)>0; return Game.save.progress.pizza.stars.every(s=>s>0)&&Game.save.progress.pie.stars.every(s=>s>0); }
  function isStageUnlocked(mode,stage){ if(stage===1)return true; return (Game.save.progress[mode].stars[stage-2]||0)>0; }
  function modeStars(mode){ return Game.save.progress[mode].stars.reduce((a,b)=>a+b,0); }
  function setScreen(next,payload={}){ Game.state.screen=next; if(payload.mode)Game.state.mode=payload.mode; render(); if(next===SCREEN.KITCHEN)startLoop(); else if(next!==SCREEN.KITCHEN)stopLoop(); history.replaceState({screen:next},''); }
  function openOverlay(type,payload={}){ Game.state.overlay={type,payload}; if(Game.state.screen===SCREEN.KITCHEN && ['pause','lesson','tutorial'].includes(type)) Game.state.timer.running=false; renderOverlay(); }
  function closeOverlay(){ const type=Game.state.overlay?.type; Game.state.overlay=null; if(type==='pause'&&Game.state.screen===SCREEN.KITCHEN)Game.state.timer.running=true; if(type==='tutorial'&&Game.state.screen===SCREEN.KITCHEN)Game.state.timer.running=true; renderOverlay(); }

  // [S5] LOGIC — 주문·접시·판정·점수
  function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
  function generateOrder(config,index){
    const allowed=config.allowed.slice();
    if(index===0 && config.newPiece){ const n=NOTES[config.newPiece]; const count=Math.max(1,Math.min(2,config.itemsPerOrder[1])); return makeOrder([{noteId:n.id,count}],config,index); }
    let ids=[];
    if(config.mixRule){ const notes=allowed.filter(id=>NOTES[id].kind==='note'),rests=allowed.filter(id=>NOTES[id].kind==='rest'); ids=[pick(notes),pick(rests)]; if(config.itemsPerOrder[0]>=4&&Math.random()>.45)ids.push(Math.random()>.5?pick(notes):pick(rests)); }
    else { const countLines=Math.min(allowed.length,Math.random()>.58?2:1), pool=allowed.slice(); while(ids.length<countLines)ids.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
    let remain=config.itemsPerOrder[1], items=[];
    ids.forEach((id,i)=>{ const max=Math.max(1,Math.min(remain,Math.floor(Math.random()*2)+config.itemsPerOrder[0]-(ids.length-1-i))); const count=i===ids.length-1?Math.max(config.itemsPerOrder[0],remain):Math.max(1,Math.min(max,Math.floor(Math.random()*3)+1)); items.push({noteId:id,count}); remain-=count; });
    if(!items.length)items=[{noteId:allowed[0],count:1}];
    let total=items.reduce((s,x)=>s+NOTES[x.noteId].ticks*x.count,0); while(total>48){ const last=items[items.length-1]; if(last.count>1){last.count--;total-=NOTES[last.noteId].ticks;}else{items.pop();total-=NOTES[last.noteId].ticks;} }
    if(total<4){ items=[{noteId:allowed[0],count:Math.max(1,Math.floor(4/NOTES[allowed[0]].ticks))}]; }
    return makeOrder(items,config,index);
  }
  function makeOrder(items,config,index){ const sequence=[];items.forEach(x=>{for(let i=0;i<x.count;i++)sequence.push(x.noteId);}); if(config.rhythmSentence&&sequence.length>1)sequence.sort(()=>Math.random()-.5); const totalTicks=sequence.reduce((s,id)=>s+NOTES[id].ticks,0); return {id:`ord_${config.mode}_${config.stage}_${index}`,items,totalTicks,beats:totalTicks/4,sequence:config.rhythmSentence?sequence:null,customerId:config.boss==='course3'||config.boss==='memory'||config.boss==='grand'?'dodo':pick(config.mode==='pizza'?['beat','melo','tempo','mongmong']:config.mode==='pie'?['melo','mongmong','beat']:['beat','melo','tempo','mongmong'])}; }
  function createPlates(){ return [{index:0,ticks:0,slices:[]}]; }
  function flatSlices(){ return Game.state.plates.flatMap(p=>p.slices); }
  function countMap(ids){ return ids.reduce((m,id)=>(m[id]=(m[id]||0)+1,m),{}); }
  function orderIds(order){return order.sequence||order.items.flatMap(x=>Array(x.count).fill(x.noteId));}
  function judge(order){ const need=countMap(orderIds(order)),have=countMap(flatSlices()); let correct=0,total=0;Object.entries(need).forEach(([id,n])=>{correct+=Math.min(n,have[id]||0);total+=n;});let wrong=0;Object.entries(have).forEach(([id,n])=>{wrong+=Math.max(0,n-(need[id]||0));});const accuracy=total?correct/total:0;const grade=accuracy===1&&wrong===0?'PERFECT':accuracy>=.5?'PARTIAL':'MISS';return {grade,accuracy,correct,wrong,need,have}; }
  function calcScore(result,remain,combo){ const base=Math.round(100*Math.max(0,result.accuracy-result.wrong*.5/Math.max(1,Object.values(result.need).reduce((a,b)=>a+b,0))));const time=result.grade==='PERFECT'?Math.min(60,Math.floor(remain*2)):0;const mult=REWARD_CONFIG.score.comboMultipliers[Math.min(combo,5)]||2;return Math.floor((base+time)*mult); }
  function addPiece(id){ const n=NOTES[id],st=Game.state,order=st.currentOrder;if(!n||!order)return false;if(st.servedTicks+n.ticks>order.totalTicks){reject('주문보다 많아요!');return false;}let plate=st.plates[st.plates.length-1];if(plate.ticks+n.ticks>PLATE_TICKS){reject(`접시가 넘쳐요! 남은 자리: ${(PLATE_TICKS-plate.ticks)/4}박`);return false;}plate.slices.push(id);plate.ticks+=n.ticks;st.servedTicks+=n.ticks;if(!Game.save.codexUnlocked.includes(id)){Game.save.codexUnlocked.push(id);showToast(`${n.name} 도감이 열렸어요!`);}if(n.kind==='note')Game.audio.note(id);else hush(n.beats);haptic(20);if(plate.ticks===PLATE_TICKS){Game.audio.complete();if(st.servedTicks<order.totalTicks)st.plates.push({index:st.plates.length,ticks:0,slices:[]});}render();return true; }
  function reject(message){ const el=document.querySelector('.active-plate');el?.classList.remove('shake');void el?.offsetWidth;el?.classList.add('shake');Game.audio.fail();haptic([60,40,60]);showToast(message); }
  function undoPiece(){ const st=Game.state; if(!st.plates.length)return; let plate=st.plates[st.plates.length-1];if(!plate.slices.length&&st.plates.length>1){st.plates.pop();plate=st.plates[st.plates.length-1];}const id=plate.slices.pop();if(!id)return;const n=NOTES[id];plate.ticks-=n.ticks;st.servedTicks-=n.ticks;render(); }
  function finishOrder(force=false){ const st=Game.state;if(st.busy||!st.currentOrder)return;if(!force&&st.servedTicks!==st.currentOrder.totalTicks){showToast(`앞으로 ${(st.currentOrder.totalTicks-st.servedTicks)/4}박 더 채워요`);return;}if(st.rush&&st.servedTicks!==st.currentOrder.totalTicks){finishRush(true);return;}st.busy=true;const result=judge(st.currentOrder),remain=Math.max(0,st.timer.leftMs/1000);if(force&&result.grade==='PERFECT')result.grade='PARTIAL';result.score=calcScore(result,remain,st.combo);const perfect=result.grade==='PERFECT';if(perfect)st.combo++;else if(result.grade==='MISS')st.combo=0;const tip=perfect?REWARD_CONFIG.coins.servePerfect:result.grade==='PARTIAL'?REWARD_CONFIG.coins.serveGood:0;st.stageStats.successes+=(result.grade==='MISS'?0:1);st.stageStats.firstTrySuccess+=(perfect?1:0);st.stageStats.remainSec+=remain;st.stageStats.tips+=tip;st.stageStats.lastResult=result;st.score+=result.score;st.tips+=tip;Game.save.coins+=tip;Game.save.totalServes++;if(perfect)Game.save.totalPerfectServes++;Game.audio[perfect?'success':'fail']();haptic(perfect?[30,30,30,30,30]:200);flashStamp(perfect?'✓':'×',perfect);render();showCustomerReaction(perfect);if(result.grade!=='PERFECT'){openOverlay('lesson',{noteId:Object.keys(result.need)[0]||'quarter',result});}else{setTimeout(advanceOrder,850);}saveNow(); }
  function advanceOrder(){ if(!Game.state.currentOrder)return;Game.state.orderIndex++;if(Game.state.orderIndex>=Game.state.orders.length){finishStage();return;}startOrder(Game.state.orderIndex); }
  function finishStage(){ const st=Game.state,cfg=stageConfig(),total=st.orders.length,accuracy=total?st.stageStats.firstTrySuccess/total*100:0,remainRatio=st.stageStats.remainSec/(total*cfg.timeLimitSec)*100;let stars=0;if(accuracy>=60)stars=1;if(accuracy>=80&&remainRatio>=20)stars=2;if(accuracy===100&&remainRatio>=35)stars=3;const mode=st.mode,old=Game.save.progress[mode].stars[st.stage-1]||0,first=old===0&&stars>0;if(stars>old)Game.save.progress[mode].stars[st.stage-1]=stars;Game.save.progress[mode].unlocked=Math.max(Game.save.progress[mode].unlocked,Math.min(10,st.stage+1));if(st.stage===10&&stars>0)st.rushUnlocked=true;const stageCoins=(REWARD_CONFIG.coins.stageStars[stars-1]||0)+(first?REWARD_CONFIG.coins.firstClearBonus:0);Game.save.coins+=stageCoins;saveNow();stopLoop();st.result={stars,accuracy,remainRatio,stageCoins,score:st.score,tips:st.tips,successes:st.stageStats.successes,total,learned:[...new Set(flatSlices())]};setScreen(SCREEN.RESULT); }
  function startStage(mode,stage,rush=false){ Game.audio.ensure();const cfg=stageConfig(mode,stage);if(!cfg)return;Game.state={screen:SCREEN.KITCHEN,mode,stage:Number(stage),rush,orders:[],orderIndex:0,currentOrder:null,plates:createPlates(),servedTicks:0,timer:{limitSec:cfg.timeLimitSec,leftMs:cfg.timeLimitSec*1000,running:true,lastTick:performance.now()},score:0,tips:0,combo:0,busy:false,stageStats:{successes:0,firstTrySuccess:0,remainSec:0,tips:0,lastResult:null},result:null,hintId:null,memoryVisible:false,memoryEndsAt:0};Game.state.orders=Array.from({length:rush?999:cfg.orders},(_,i)=>generateOrder(cfg,i));Game.save.tutorialDone[mode]=Game.save.tutorialDone[mode]||false;setScreen(SCREEN.KITCHEN);startOrder(0);if(!rush&&!Game.save.tutorialDone[mode])openOverlay('tutorial',{mode}); }
  function finishRush(failed=false){ const st=Game.state;if(st.busy)return;st.busy=true;st.timer.running=false;const comboMultiplier=Math.min(2,Math.pow(1.1,Math.max(0,st.combo)));const rushScore=Math.floor(st.stageStats.successes*100*comboMultiplier);const best=Game.save.rushBest[st.mode];const isNew=rushScore>best.score||st.stageStats.successes>best.servedOrders;if(isNew){best.score=Math.max(best.score,rushScore);best.servedOrders=Math.max(best.servedOrders,st.stageStats.successes);}const rushCoins=Math.floor(rushScore/REWARD_CONFIG.coins.rushScoreDivisor);Game.save.coins+=rushCoins;saveNow();stopLoop();st.result={rush:true,stars:0,accuracy:st.stageStats.successes?100:0,remainRatio:0,stageCoins:rushCoins,score:rushScore,tips:st.tips,successes:st.stageStats.successes,total:st.orderIndex+1,learned:[],isNew,failed};setScreen(SCREEN.RESULT); }
  function rushFinishOrder(force=false){ const st=Game.state,order=st.currentOrder;if(st.busy||!order)return;if(st.servedTicks!==order.totalTicks){st.rushFailureNote=order.items[0]?.noteId||'quarter';rushFinish(true);return;}const result=judge(order);if(result.grade!=='PERFECT'){st.rushFailureNote=Object.keys(result.need||{})[0]||order.items[0]?.noteId||'quarter';rushFinish(true);return;}st.busy=true;const remain=Math.max(0,st.timer.leftMs/1000);st.combo=Math.min(2,Math.max(1,st.combo)*1.1);const orderScore=Math.round((100+remain*5)*st.combo);st.score+=orderScore;st.stageStats.successes++;st.stageStats.remainSec+=remain;st.stageStats.lastResult=result;Game.save.totalServes++;Game.save.totalPerfectServes++;Game.audio.success();haptic([30,30,30,30,30]);flashStamp('✓',true);render();showCustomerReaction(true);saveNow();setTimeout(advanceOrder,420); }

  function startOrder(index){ const st=Game.state;st.busy=false;st.orderIndex=index;st.currentOrder=st.orders[index];st.plates=createPlates();st.servedTicks=0;const cfg=stageConfig();st.timer={limitSec:st.rush?Math.max(8,24-.5*index):cfg.timeLimitSec,leftMs:(st.rush?Math.max(8,24-.5*index):cfg.timeLimitSec)*1000,running:!st.overlay,lastTick:performance.now()};st.memoryVisible=!st.rush&&(cfg.boss==='memory'||cfg.boss==='grand');st.memoryEndsAt=performance.now()+(st.memoryVisible?5000:0);render(); }

  function previewPiece(id){suppressClickUntil=Date.now()+350;Game.audio.note(id);if(NOTES[id].kind==='rest')hush(NOTES[id].beats);showToast(`${NOTES[id].name} · ${NOTES[id].beats}박`);}

  // [S8] FX / TIMER — rAF 단일 루프
  function startLoop(){stopLoop();const tick=(now)=>{Game.raf=requestAnimationFrame(tick);if(Game.state.screen!==SCREEN.KITCHEN)return;const st=Game.state;if(st.timer.running&&!st.overlay&&!window.rulebook?.isOpen){const dt=now-st.timer.lastTick;st.timer.leftMs-=dt;st.timer.lastTick=now;if(st.memoryVisible&&now>=st.memoryEndsAt){st.memoryVisible=false;render();}updateTimerUi();if(st.timer.leftMs<=0){st.timer.leftMs=0;st.timer.running=false;showToast('시간이 다 됐어요!');if(st.rush)rushFinish(true);else finishOrder(true);}}else st.timer.lastTick=now;};Game.state.timer.lastTick=performance.now();Game.raf=requestAnimationFrame(tick);}
  function stopLoop(){if(Game.raf)cancelAnimationFrame(Game.raf);Game.raf=0;}
  function updateTimerUi(){const st=Game.state,cfg=stageConfig();const limit=st.timer.limitSec*1000,left=Math.max(0,st.timer.leftMs),ratio=left/limit;const fill=document.getElementById('time-fill'),num=document.getElementById('time-number');if(fill){fill.style.width=(ratio*100)+'%';fill.classList.toggle('warn',ratio<=.3);}if(num)num.textContent=Math.ceil(left/1000)+'초';}
  function updateScale(){const vw=window.innerWidth,vh=Math.max(1,(window.visualViewport?.height||window.innerHeight)-56);const s=Math.min(vw/390,vh/844,1.6);Game.state.scale=s;const wrap=document.getElementById('scale-wrap');if(wrap)wrap.style.transform=`translate(-50%,-50%) scale(${s})`;}

  // [S9] BOOT / EVENTS
  function action(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(Date.now()<suppressClickUntil&&['preview-piece'].includes(a))return;Game.audio.ensure();Game.audio.button();
    if(a==='splash-start'){setScreen(SCREEN.MAIN);return;}if(a==='go-main'){setScreen(SCREEN.MAIN);return;}if(a==='go-mode'){setScreen(SCREEN.MODE);return;}if(a==='go-codex'){Game.state.codexKind='note';Game.state.codexBack=Game.state.screen;setScreen(SCREEN.CODEX);return;}if(a==='open-settings'){openOverlay('settings');return;}
    if(a==='choose-mode'){const mode=el.dataset.mode;if(!isModeUnlocked(mode)){showToast('아직 잠긴 주방이에요');return;}Game.state.mode=mode;setScreen(SCREEN.STAGE);return;}
    if(a==='stage-node'){const stage=Number(el.dataset.stage);if(!isStageUnlocked(Game.state.mode,stage)){showToast(`스테이지 ${stage-1}을 별 1개로 깨면 열려요`);return;}openOverlay('preview',{mode:Game.state.mode,stage});return;}
    if(a==='start-preview'){const p=Game.state.overlay.payload;closeOverlay();startStage(p.mode,p.stage);return;}if(a==='stage-rush'){if(Game.save.progress[Game.state.mode].stars[9]>0)startStage(Game.state.mode,10,true);else showToast('스테이지 10을 먼저 깨 주세요');return;}
    if(a==='go-rush'){if(['pizza','pie','mix'].some(m=>Game.save.progress[m].stars[9]>0))openOverlay('rush');else showToast('스테이지 10을 깨면 러시가 열려요');return;}if(a==='start-rush'){const mode=el.dataset.mode;if(Game.save.progress[mode].stars[9]<=0)return;closeOverlay();startStage(mode,10,true);return;}
    if(a==='pause'){openOverlay('pause');return;}if(a==='resume'){closeOverlay();return;}if(a==='restart-stage'){closeOverlay();startStage(Game.state.mode,Game.state.stage,Game.state.rush);return;}if(a==='leave-stage'){closeOverlay();setScreen(SCREEN.STAGE);return;}
    if(a==='preview-piece'){previewPiece(el.dataset.note);return;}if(a==='undo'){undoPiece();return;}if(a==='hint'){hint();return;}if(a==='serve'){if(Game.state.rush)rushFinishOrder();else finishOrder();return;}if(a==='ticket-preview'){const ids=orderIds(Game.state.currentOrder||{items:[]});ids.forEach((id,i)=>setTimeout(()=>{Game.audio.note(id);if(NOTES[id].kind==='rest')hush(NOTES[id].beats);},i*BEAT_MS));return;}
    if(a==='lesson-ok'){continueAfterLesson();return;}if(a==='result-next'){startStage(Game.state.mode,Game.state.stage+1);return;}if(a==='result-retry'){startStage(Game.state.mode,Game.state.stage,Game.state.rush);return;}if(a==='result-stage'){setScreen(SCREEN.STAGE);return;}if(a==='result-main'){setScreen(SCREEN.MAIN);return;}
    if(a==='codex-back'){setScreen(Game.state.codexBack||SCREEN.MAIN);return;}if(a==='codex-kind'){Game.state.codexKind=el.dataset.kind;render();return;}if(a==='listen-note'){Game.audio.note(el.dataset.note);if(NOTES[el.dataset.note].kind==='rest')hush(NOTES[el.dataset.note].beats);return;}if(a==='codex-note'){Game.state.codexKind=NOTES[el.dataset.note].kind;setScreen(SCREEN.CODEX);return;}
    if(a==='close-overlay'){closeOverlay();return;}if(a==='tutorial-continue'){Game.save.tutorialDone[Game.state.mode]=true;saveNow();closeOverlay();return;}if(a==='set-sound'){Game.save.settings.sound=el.dataset.value;saveNow();renderOverlay();return;}if(a==='toggle-setting'){const k=el.dataset.setting;Game.save.settings[k]=!Game.save.settings[k];saveNow();renderOverlay();if(k==='lefty'||k==='showBeats')render();return;}if(a==='reset-progress'){if(el.dataset.confirm==='yes'){localStorage.removeItem('npizza.save.v1');Game.save=DEFAULT_SAVE();Game.state.overlay=null;setScreen(SCREEN.MAIN);showToast('진행 기록을 초기화했어요');}else{el.dataset.confirm='yes';el.textContent='정말 지울까요? 다시 눌러 주세요';setTimeout(()=>{if(el.isConnected){el.dataset.confirm='';el.textContent='진행 기록 초기화';}},2500);}return;}
  }
  document.addEventListener('click',action);document.addEventListener('pointerdown',onPointerDown,{passive:false});document.addEventListener('pointermove',onPointerMove,{passive:false});document.addEventListener('pointerup',e=>endPointer(e,false),{passive:false});document.addEventListener('pointercancel',e=>endPointer(e,true),{passive:false});
  window.addEventListener('resize',updateScale);window.visualViewport?.addEventListener('resize',updateScale);document.addEventListener('visibilitychange',()=>{if(document.hidden&&Game.state.screen===SCREEN.KITCHEN&&!Game.state.overlay)openOverlay('pause');});window.addEventListener('popstate',()=>{if(Game.state.overlay)closeOverlay();else if(Game.state.screen===SCREEN.KITCHEN)openOverlay('pause');else if(Game.state.screen===SCREEN.MODE)setScreen(SCREEN.MAIN);else if(Game.state.screen===SCREEN.STAGE)setScreen(SCREEN.MODE);else setScreen(SCREEN.MAIN);});
  Game.save=loadSave();Game.state={screen:SCREEN.SPLASH,mode:'pizza',stage:1,scale:1,overlay:null,codexKind:'note',codexBack:SCREEN.MAIN};render();
  </script>
  <script src="rulebook-diagrams.js"></script>
  <script src="rulebook.js"></script>
</body>
